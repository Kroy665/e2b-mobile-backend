services:
  - type: web
    name: e2b-mobile-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "120"
      - key: E2B_TEMPLATE_ID
        value: 77gbcsv20q8kxklidjhe

      # Set APP_URL to this service's actual Render URL once known
      # (https://<service-name>.onrender.com), then update
      # GITHUB_OAUTH_REDIRECT_URI to match and update the GitHub OAuth App's
      # callback URL to the same value.
      - key: APP_URL
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false

      # Secrets: enter these in the Render dashboard, never commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
